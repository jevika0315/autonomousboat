# ── JVM Memory ───────────────────────────────────────────────────────────────
# Conservative value that works on both local Windows machines AND cloud CI.
# The GitHub Actions workflow overrides this with GRADLE_OPTS env variable
# giving it 3G when building in the cloud.
org.gradle.jvmargs=-Xmx1280m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# ── Gradle performance ───────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true

# ── AndroidX (required by flutter_webrtc — do not change) ────────────────────
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedOptionWarnings=android.enableJetifier

# ── Suppress noisy build warnings ────────────────────────────────────────────
android.defaults.buildfeatures.buildconfig=true
