name: Build EV SQUARE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Print versions and pre-installed NDK list
        run: |
          flutter --version
          java -version
          echo "=== Pre-installed NDKs on this runner ==="
          ls $ANDROID_HOME/ndk/ || echo "No NDK folder found"
          echo "=== Android SDK packages ==="
          ls $ANDROID_HOME/

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --no-tree-shake-icons
        env:
          JAVA_OPTS: "-Xmx512m"
          GRADLE_OPTS: "-Dorg.gradle.logging.stacktrace=all"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evsquare-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload heap dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heap-dump
          path: |
            **/*.hprof
            **/hs_err_pid*.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Show APK info
        run: |
          echo "=== BUILD SUCCESSFUL ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk
